[book]
title = "从意图到应用 · Agentic App 黑客松课程"
description = "OctoSense × Makepad、octoscode × Octoscript：四小时课程、学员练习与讲师手册。"
language = "zh-CN"
src = "docs"

[build]
build-dir = "book"
create-missing = false
use-default-preprocessors = false
extra-watch-dirs = ["book-theme"]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["book-theme/course.css"]
git-repository-url = "https://github.com/gosimfoundation/hackathon-agenticapp26"
no-section-label = true
sidebar-header-nav = true
additional-js = ["book-theme/mermaid.min.js", "book-theme/mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 20

[output.html.print]
enable = true
page-break = true

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Keep nested README filenames stable so existing Markdown links still resolve.
[preprocessor.links]
